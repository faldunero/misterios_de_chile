<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historias y Misterios de Chile - Leyendas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lora', serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        /* BOTÓN MODAL */
        .btn-leyenda {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: linear-gradient(135deg, #d4af37, #a07830);
            color: #1a1a2e;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
            transition: all 0.3s ease;
        }

        .btn-leyenda:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.6);
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #16213e;
            border: 2px solid #d4af37;
            border-radius: 12px;
            max-width: 800px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 40px;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #d4af37;
            padding-bottom: 15px;
        }

        .modal-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            color: #d4af37;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 32px;
            color: #d4af37;
            cursor: pointer;
            transition: color 0.3s;
        }

        .close-btn:hover {
            color: #fff;
        }

        .leyenda-item {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
        }

        .leyenda-item:last-child {
            border-bottom: none;
        }

        .leyenda-item h3 {
            color: #d4af37;
            font-size: 18px;
            margin-bottom: 8px;
            font-family: 'Playfair Display', serif;
        }

        .leyenda-item .region {
            color: #a07830;
            font-size: 13px;
            font-style: italic;
            margin-bottom: 10px;
        }

        .leyenda-item p {
            color: #c0c0c0;
            line-height: 1.6;
            font-size: 14px;
        }

        /* CONTENEDOR PRINCIPAL */
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
            padding-top: 40px;
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 48px;
            color: #d4af37;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(212, 175, 55, 0.3);
        }

        .header p {
            font-size: 16px;
            color: #a0a0a0;
            max-width: 600px;
            margin: 0 auto;
        }

        /* GRID DE TARJETAS */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }

        /* TARJETA */
        .card {
            background: #0f3460;
            border: 2px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            height: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .card:hover {
            border-color: #d4af37;
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.3);
        }

        /* IMAGEN DE LA TARJETA */
        .card-image {
            width: 100%;
            height: 240px;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            position: relative;
        }

        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .card:hover .card-image img {
            transform: scale(1.05);
        }

        /* OVERLAY SOBRE LA IMAGEN */
        .card-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 100%;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
            pointer-events: none;
        }

        /* CONTENIDO DE LA TARJETA */
        .card-content {
            padding: 25px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            color: #d4af37;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .card-meta {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            font-size: 12px;
            color: #a07830;
        }

        .card-meta span {
            display: flex;
            align-items: center;
        }

        .card-description {
            color: #c0c0c0;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 15px;
            flex-grow: 1;
        }

        .card-button {
            background: linear-gradient(135deg, #d4af37, #a07830);
            color: #1a1a2e;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
            align-self: flex-start;
        }

        .card-button:hover {
            transform: translateX(4px);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.4);
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 32px;
            }

            .cards-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .modal-content {
                padding: 25px;
            }

            .btn-leyenda {
                padding: 10px 16px;
                font-size: 12px;
            }
        }

        /* SCROLL PERSONALIZADO */
        .modal-content::-webkit-scrollbar {
            width: 8px;
        }

        .modal-content::-webkit-scrollbar-track {
            background: rgba(212, 175, 55, 0.1);
            border-radius: 10px;
        }

        .modal-content::-webkit-scrollbar-thumb {
            background: #d4af37;
            border-radius: 10px;
        }

        .modal-content::-webkit-scrollbar-thumb:hover {
            background: #a07830;
        }
    </style>
</head>
<body>
    <!-- BOTÓN MODAL -->
    <button class="btn-leyenda" onclick="abrirModal()">📖 Resumen de Leyendas</button>

    <!-- MODAL -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Resumen de Leyendas Chilenas</h2>
                <button class="close-btn" onclick="cerrarModal()">✕</button>
            </div>

            <div id="modal-body">
                <!-- Se llena con JavaScript -->
            </div>
        </div>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="container">
        <div class="header">
            <h1>Historias y Leyendas de Chile</h1>
            <p>Explora los mitos, leyendas y misterios que han capturado la imaginación de generaciones chilenas. Haz clic en cualquier tarjeta para aprender más.</p>
        </div>

        <div class="cards-grid" id="cards-container">
            <!-- Se llena con JavaScript -->
        </div>
    </div>

    <script>
        const leyendas = [
            {
                id: "caleuche",
                titulo: "El Caleuche: Barco Fantasma",
                region: "Chiloé",
                periodo: "Leyenda Chilota",
                descripcion: "Un barco fantasma que navega los mares del sur, tripulado por brujos y almas atrapadas.",
                imagen: "https://d2xsxph8kpxj0f.cloudfront.net/310519663575261942/9ruz5LfiTZW2kYyzstUBcW/leyenda-caleuche-FZAnrtPzpHFeucR5TpywXk.webp",
                resumen: "El Caleuche es una leyenda chilota que habla de un barco fantasma que navega durante la noche por los mares de Chiloé. Según la tradición, es tripulado por brujos y almas de marineros ahogados. Se dice que brilla con una luz misteriosa y que aquellos que lo ven están condenados a desaparecer. Esta leyenda refleja los miedos ancestrales de los marineros chilotes y la fusión de creencias indígenas con tradiciones españolas."
            },
            {
                id: "trauco",
                titulo: "El Trauco: Duende del Bosque",
                region: "Sur de Chile",
                periodo: "Mitología Mapuche",
                descripcion: "Una pequeña criatura de aspecto horrible pero mirada cautivadora que habita en los bosques.",
                imagen: "https://d2xsxph8kpxj0f.cloudfront.net/310519663575261942/9ruz5LfiTZW2kYyzstUBcW/trauco-bosque-H58SXwkVGuRhpPauTXjS3E.webp",
                resumen: "El Trauco es una criatura legendaria de la mitología chilota, descrito como un pequeño duende de aspecto desagradable pero con una mirada hipnotizante. Habita en los bosques húmedos del sur de Chile y, según la leyenda, seduce a mujeres jóvenes que se aventuran solas en el bosque. Se dice que deja a sus víctimas en un estado de debilidad y tristeza. Esta leyenda servía como advertencia para que las mujeres no se alejaran solas del poblado."
            },
            {
                id: "laguna-inca",
                titulo: "La Laguna del Inca",
                region: "Cordillera Central",
                periodo: "Leyenda Inca",
                descripcion: "Una historia de amor y tragedia que explica el color esmeralda de esta mágica laguna.",
                imagen: "https://d2xsxph8kpxj0f.cloudfront.net/310519663575261942/9ruz5LfiTZW2kYyzstUBcW/laguna-inca-hoCWUGNNXxKWvhmXAknaKu.webp",
                resumen: "La Laguna del Inca es una hermosa laguna de color esmeralda ubicada en la Cordillera de los Andes. Según la leyenda, su color especial proviene de las lágrimas de una princesa inca que lloró la muerte de su amado guerrero. Se dice que el cuerpo del guerrero fue arrojado a la laguna, y sus lágrimas de dolor tiñeron el agua de ese color verde extraordinario. Esta leyenda romántica explica el fenómeno natural de la laguna y representa la fusión de la mitología inca con la geografía chilena."
            },
            {
                id: "tirana",
                titulo: "La Tirana del Tamarugal",
                region: "Desierto de Atacama",
                periodo: "Siglo XVI",
                descripcion: "Princesa inca que se convirtió en guerrera temida. Una leyenda de amor imposible.",
                imagen: "https://d2xsxph8kpxj0f.cloudfront.net/310519663575261942/9ruz5LfiTZW2kYyzstUBcW/misterios-chile-ZProP2E7AFYmMAKypVZiMw.webp",
                resumen: "La Tirana es la leyenda de una princesa inca que, tras la muerte de su amado a manos de conquistadores españoles, se convirtió en una guerrera despiadada. Lideró una banda de guerreros en el desierto de Atacama, vengándose de los españoles. Según la leyenda, fue capturada y ejecutada, pero su espíritu sigue vagando por el desierto. Esta historia representa la resistencia indígena a la conquista española y el amor perdido en tiempos de guerra."
            },
            {
                id: "pincoya",
                titulo: "La Pincoya: Diosa del Mar",
                region: "Chiloé",
                periodo: "Mitología Chilota",
                descripcion: "Encarnación de la fertilidad marina, protectora de los océanos australes.",
                imagen: "https://d2xsxph8kpxj0f.cloudfront.net/310519663575261942/9ruz5LfiTZW2kYyzstUBcW/misterios-chile-ZProP2E7AFYmMAKypVZiMw.webp",
                resumen: "La Pincoya es una figura mitológica chilota que representa la fertilidad del mar y la abundancia de los océanos. Se describe como una hermosa mujer que emerge del agua y danza en las playas. Según la creencia, su aparición es un signo de buena pesca y abundancia. Los marineros y pescadores chilotes la veneran como protectora de sus actividades en el mar. Esta leyenda refleja la relación profunda que los pueblos costeros tienen con el océano y su dependencia de sus recursos."
            }
        ];

        // Función para llenar las tarjetas
        function llenarTarjetas() {
            const container = document.getElementById('cards-container');
            container.innerHTML = leyendas.map(leyenda => `
                <div class="card">
                    <div class="card-image">
                        <img src="${leyenda.imagen}" alt="${leyenda.titulo}">
                        <div class="card-overlay"></div>
                    </div>
                    <div class="card-content">
                        <h3 class="card-title">${leyenda.titulo}</h3>
                        <div class="card-meta">
                            <span>📍 ${leyenda.region}</span>
                            <span>⏰ ${leyenda.periodo}</span>
                        </div>
                        <p class="card-description">${leyenda.descripcion}</p>
                        <button class="card-button" onclick="mostrarLeyenda('${leyenda.id}')">Leer Más</button>
                    </div>
                </div>
            `).join('');
        }

        // Función para llenar el modal
        function llenarModal() {
            const modalBody = document.getElementById('modal-body');
            modalBody.innerHTML = leyendas.map(leyenda => `
                <div class="leyenda-item">
                    <h3>${leyenda.titulo}</h3>
                    <div class="region">📍 ${leyenda.region} • ⏰ ${leyenda.periodo}</div>
                    <p>${leyenda.resumen}</p>
                </div>
            `).join('');
        }

        // Función para abrir el modal
        function abrirModal() {
            document.getElementById('modal').classList.add('active');
        }

        // Función para cerrar el modal
        function cerrarModal() {
            document.getElementById('modal').classList.remove('active');
        }

        // Función para mostrar leyenda (puede expandirse)
        function mostrarLeyenda(id) {
            const leyenda = leyendas.find(l => l.id === id);
            if (leyenda) {
                alert(`${leyenda.titulo}\n\n${leyenda.resumen}`);
            }
        }

        // Cerrar modal al hacer clic fuera
        window.onclick = function(event) {
            const modal = document.getElementById('modal');
            if (event.target === modal) {
                cerrarModal();
            }
        }

        // Inicializar
        document.addEventListener('DOMContentLoaded', function() {
            llenarTarjetas();
            llenarModal();
        });
    </script>
</body>
</html>
