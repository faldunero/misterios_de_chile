<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misterios de Chile - Juego Histórico</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #3b82f6;
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .view { display: none; flex-direction: column; align-items: center; width: 100%; padding: 20px; box-sizing: border-box; }
        .view.active { display: flex; }

        h1 { margin-top: 10px; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; text-align: center; font-size: 1.8rem; }

        .main-logo {
            max-width: 420px; 
            height: auto;
            margin-top: 40px;
        }

        .qr-wrapper {
            background: white;
            padding: 20px;
            border-radius: 20px;
            margin: 30px 0;
            width: 100%;
            max-width: 280px; 
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px rgba(59, 130, 246, 0.2);
            cursor: pointer;
        }
        
        #qr-image { width: 100%; height: auto; display: none; }
        .placeholder-text { color: #64748b; font-style: italic; text-align: center; font-size: 0.9rem; }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            padding: 18px 30px;
            border-radius: 50px;
            font-weight: 800;
            border: none;
            cursor: pointer;
            width: 100%;
            max-width: 320px;
        }

        .btn-primary:disabled {
            background: #334155;
            cursor: not-allowed;
            opacity: 0.6;
        }

        #history-section { 
            margin-top: 40px; 
            width: 100%; 
            max-width: 900px; 
            text-align: center;
            padding-bottom: 60px; 
        }
        .history-list { 
            display: flex; 
            gap: 15px; 
            padding: 20px; 
            justify-content: center; 
            flex-wrap: wrap;
        }
        
        .history-item-container { 
            position: relative; 
            flex: 0 0 80px; 
            height: 60px; 
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1;
        }

        .history-item-container:hover { 
            transform: scale(3); 
            z-index: 10; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        
        .history-item { 
            width: 100%; 
            height: 100%; 
            border-radius: 6px; 
            object-fit: cover; 
            border: 2px solid #334155; 
            display: block;
        }

        .history-id-tag {
            position: absolute;
            bottom: 2px;
            right: 2px;
            background: rgba(15, 23, 42, 0.9);
            color: var(--accent);
            font-size: 8px;
            font-weight: bold;
            padding: 1px 3px;
            border-radius: 3px;
            pointer-events: none;
        }

        #player-overlay { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.97); 
            z-index: 9000; 
            flex-direction: column; 
            justify-content: space-between;
            align-items: center; 
            overflow: hidden;
            padding: 12px 16px 16px;
            box-sizing: border-box;
            gap: 0;
        }

        #player-overlay .main-logo {
            margin-top: 0;
            margin-bottom: 0;
            max-width: 160px;
            flex-shrink: 0;
        }

        .mystery-content { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            gap: 12px; 
            width: 100%;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        #full-img { 
            display: block;
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 12px; 
            box-shadow: 0 0 30px rgba(0,0,0,0.4);
            border: 2px solid #334155;
        }

        .pistas-column { 
            display: flex; 
            flex-direction: row; 
            gap: 10px; 
            width: 100%;
            justify-content: center;
        }

        .btn-pista { 
            background: #1e40af; 
            color: white; 
            padding: 12px 20px; 
            border: none; 
            border-radius: 10px; 
            font-weight: bold; 
            cursor: pointer; 
            flex: 1;
            max-width: 120px;
            font-size: 0.9rem;
        }

        .btn-pista:disabled { 
            background: #1e293b; 
            color: #475569; 
            border: 1px solid #334155; 
            cursor: not-allowed; 
            opacity: 0.7; 
        }

        .controls { 
            background: #0b1120; 
            padding: 12px 16px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 20px; 
            width: 100%; 
            max-width: 500px; 
            border-radius: 12px;
            border: 1px solid #1e293b;
            margin-top: 0;
            flex-shrink: 0;
        }

        #pista-modal { 
            display: none; 
            position: fixed; 
            top: 50%; left: 50%; 
            transform: translate(-50%, -50%); 
            background: var(--card-bg); 
            padding: 30px; 
            border-radius: 20px; 
            border: 2px solid var(--accent); 
            z-index: 10000; 
            width: 85%; 
            max-width: 400px; 
            text-align: center; 
        }

        .modal-overlay-bg { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.8); 
            z-index: 9999; 
        }

        footer { margin-top: auto; padding: 20px; color: var(--text-dim); font-size: 0.85rem; text-align: center; }

        @media (max-width: 768px) {
            h1 { font-size: 1.4rem; }
            .main-logo { max-width: 280px; }
            .pistas-column { flex-direction: column; align-items: center; }
            .btn-pista { max-width: 280px; width: 100%; }
            .controls { flex-direction: column; gap: 10px; width: 90%; }
        }
    </style>
</head>
<body>

    <div id="modal-bg" class="modal-overlay-bg" onclick="cerrarPista()"></div>

    <!-- Modal Pista -->
    <div id="pista-modal">
        <h2 style="color:var(--accent); margin-top:0; font-size:1.1rem;" id="pista-titulo">Pista Revelada</h2>
        <p id="pista-texto" style="line-height:1.6; margin:16px 0; font-size:0.95rem; color:#e2e8f0;"></p>
        <button onclick="cerrarPista()" style="padding:10px 24px; background:var(--accent); border:none; color:white; border-radius:8px; cursor:pointer; font-weight:bold;">ENTENDIDO</button>
    </div>

    <!-- Modal Evaluación 1 a 1 -->
    <div id="eval-modal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);

         z-index:10000; width:90%; max-width:420px; box-shadow:0 20px 60px rgba(0,0,0,0.7);">

        <!-- Header -->
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <div style="display:flex; align-items:center; gap:10px;">

                <span id="eval-step-badge" style="background:#3b82f6; color:white; border-radius:999px; font-size:0.72rem; font-weight:bold; padding:3px 10px;">1 / 3</span>
            </div>
            <button onclick="cerrarEvaluacion()" style="background:transparent; border:none; color:#94a3b8; font-size:1.5rem; cursor:pointer; line-height:1;">&times;</button>
        </div>

        <!-- Pregunta -->
        <p id="eval-pregunta-texto" style="font-size:1rem; color:#f1f5f9; font-weight:bold; margin:0 0 16px 0;"></p>

        <!-- Respuesta -->
        <p id="eval-respuesta-texto" style="display:none; font-size:1rem; color:#22c55e; font-weight:bold; margin:0 0 20px 0; padding:14px; background:#0d2137; border-radius:10px; border:1px solid #3b82f6;"></p>

        <!-- Botones -->
        <div style="display:flex; gap:10px;">
            <button id="eval-btn-mostrar" onclick="mostrarRespuesta()"
                style="flex:1; padding:10px; background:#f59e0b; color:#0f172a; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">
                👁 Mostrar respuesta
            </button>
            <button id="eval-btn-siguiente" onclick="siguientePregunta()"
                style="display:none; flex:1; padding:10px; background:#22c55e; color:#0f172a; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">
                Siguiente →
            </button>
        </div>

        <div style="display:flex; gap:6px; justify-content:center; margin-top:16px;">
            <div id="eval-dot-1" style="width:8px; height:8px; border-radius:50%; background:#3b82f6;"></div>
            <div id="eval-dot-2" style="width:8px; height:8px; border-radius:50%; background:#334155;"></div>
            <div id="eval-dot-3" style="width:8px; height:8px; border-radius:50%; background:#334155;"></div>
        </div>
    </div>

    <div id="view-generator" class="view active">

        <div id="history-section" style="display:none;">

        </div>

        <footer>
            Autor: <strong>Felipe Ignacio Aldunate Romero</strong> (<a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="6204030e06170c03160722050f030b0e4c010d0f">[email&#160;protected]</a>)<br>

        </footer>
    </div>

    <div id="view-gallery" class="view">
        <h1>Galería Completa</h1>
        <div id="selection-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; width: 100%; max-width: 1000px;"></div>
        <button onclick="showGenerator()" style="background: transparent; color: var(--text-dim); border: 1px solid #334155; padding: 10px 20px; border-radius: 8px; margin-top: 20px; cursor: pointer;">Volver al Generador</button>
    </div>

    <div id="player-overlay">

            </div>
            <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
                <button onclick="toggleAudio()" id="btn-play" style="padding:10px 20px; background:#3b82f6; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">PAUSAR</button>
                <button onclick="terminarAudio()" id="btn-terminar" style="padding:10px 20px; background:#16a34a; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">✓ TERMINAR</button>

                <button onclick="closePlayer()" style="padding:10px 20px; background:transparent; color:white; border:1px solid #334155; border-radius:8px; cursor:pointer;">CERRAR</button>
            </div>
        </div>

            const resp = respuestasData[currentActiveID];

            document.getElementById('eval-step-badge').innerText = `${evalPaso+1} / 3`;
            [1,2,3].forEach(i => {
                document.getElementById(`eval-dot-${i}`).style.background = i === evalPaso+1 ? '#3b82f6' : '#334155';
            });

            document.getElementById('eval-pregunta-texto').innerText        = q.texto;
            document.getElementById('eval-respuesta-texto').innerText       = resp[q.clave];
            document.getElementById('eval-respuesta-texto').style.display   = 'none';
            document.getElementById('eval-btn-mostrar').style.display       = '';
            const btnSig = document.getElementById('eval-btn-siguiente');
            btnSig.style.display = 'none';
            btnSig.innerText = evalPaso < 2 ? 'Siguiente →' : '✓ Finalizar';
        }

        function mostrarRespuesta() {
            document.getElementById('eval-respuesta-texto').style.display = 'block';
            document.getElementById('eval-btn-mostrar').style.display     = 'none';
            document.getElementById('eval-btn-siguiente').style.display   = '';
        }

        function siguientePregunta() {
            if(evalPaso < 2) {
                evalPaso++;
                renderEvalPaso();
            } else {
                cerrarEvaluacion();
            }
        }

        function cerrarEvaluacion() {
            document.getElementById('modal-bg').style.display   = 'none';
            document.getElementById('eval-modal').style.display = 'none';
        }

        // ── Pistas ────────────────────────────────────────────────────────
        function imgError(el) { el.style.display = 'none'; }
        function thumbError(el) {
            el.style.display = 'none';
            const ph = document.createElement('div');
            ph.style.cssText = 'width:100%;height:110px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;';
            ph.innerText = '🔊';
            el.parentElement.insertBefore(ph, el.nextSibling);
        }

        function updateCounter() {
            const info = document.getElementById('counter-info');
            if(info) info.innerText = `Misterios restantes: ${availableIDs.length}`;
            if(availableIDs.length === 0) {
                const btn = document.getElementById('btn-generate');
                if(btn) { btn.innerText = "PARTIDA COMPLETADA"; btn.disabled = true; }
            }
        }

        // Genera una matriz QR visual pseudo-aleatoria basada en el ID
        function drawFakeQR(id) {
            const svg = document.getElementById('qr-svg');
            const size = 21;
            let rects = '';
            // Seed determinista basada en id
            let seed = parseInt(id) * 7919;
            function rand() { seed = (seed * 1664525 + 1013904223) & 0xffffffff; return (seed >>> 0) / 0xffffffff; }

            for(let y = 0; y < size; y++) {
                for(let x = 0; x < size; x++) {
                    // Esquinas fijas (finder patterns) — simula QR real
                    const inFinder = (
                        (x < 8 && y < 8) ||
                        (x >= size-8 && y < 8) ||
                        (x < 8 && y >= size-8)
                    );
                    let fill = '#000000';
                    let draw = false;

                    if(inFinder) {
                        // Finder pattern: cuadrado exterior + interior
                        const fx = x < 8 ? x : x - (size-8);
                        const fy = y < 8 ? y : y - (size-8);
                        if(fx === 0 || fx === 6 || fy === 0 || fy === 6) draw = true;
                        else if(fx >= 2 && fx <= 4 && fy >= 2 && fy <= 4) draw = true;
                    } else if(x === 7 || x === size-8 || y === 7) {
                        draw = false; // separador
                    } else if((x % 2 === 0 && y === 6) || (y % 2 === 0 && x === 6)) {
                        draw = (x + y) % 2 === 0; // timing pattern
                    } else {
                        draw = rand() > 0.45;
                    }
                    if(draw) rects += `<rect x="${x}" y="${y}" width="1" height="1" fill="${fill}"/>`;
                }
            }
            svg.innerHTML = rects;
            document.getElementById('qr-id-label').innerText = `ID ${id} — ${eventosData[id] || ''}`;
        }

        function generateRandomQR() {
            if(availableIDs.length === 0) return;
            const idx = Math.floor(Math.random() * availableIDs.length);
            currentActiveID = availableIDs[idx];
            availableIDs.splice(idx, 1);
            drawFakeQR(currentActiveID);
            document.getElementById('qr-image').style.display = 'block';
            document.getElementById('qr-placeholder').style.display = 'none';
            updateCounter();
        }

        function clickToOpen() {
            if(currentActiveID) openMystery(currentActiveID, true);
        }

        function openMystery(id, addToHistory=false) {
            currentActiveID   = id;
            const nombre      = baseNombres[id];
            const tieneImagen = idsConImagen.has(id);
            const tieneAudio  = idsConAudio.has(id);

            const imgEl = document.getElementById('full-img');
            if(tieneImagen) {
                imgEl.style.display = 'block';
                imgEl.src = `./imagenes/${nombre}.png`;
            } else {
                imgEl.style.display = 'none';
                imgEl.src = '';
            }

            document.querySelectorAll('.btn-pista').forEach(btn => {
                btn.disabled = true;
                btn.innerText = "Pista " + btn.id.split('-').pop();
            });
            document.getElementById('btn-evaluar').style.display = 'none';

            const audio = document.getElementById('audio-player');
            if(tieneAudio) {
                audio.src = `./audios/${nombre}.mp4`;
                document.getElementById('pista-status').innerText = "Escucha el audio para desbloquear pistas";
                document.getElementById('pista-status').style.color = "var(--accent)";
                document.getElementById('btn-play').style.display     = '';
                document.getElementById('btn-terminar').style.display = '';
                audio.play();
                document.getElementById('btn-play').innerText = "PAUSAR";
            } else {
                audio.src = '';
                document.getElementById('pista-status').innerText = "Audio en preparación — pistas disponibles directamente";
                document.getElementById('pista-status').style.color = "#f59e0b";
                document.getElementById('btn-play').style.display     = 'none';
                document.getElementById('btn-terminar').style.display = 'none';
                document.querySelectorAll('.btn-pista').forEach(btn => btn.disabled = false);
            }

            document.getElementById('player-overlay').style.display = 'flex';
            if(addToHistory && !viewedHistory.includes(id)) {
                viewedHistory.unshift(id);
                updateHistoryUI();
            }
        }

        document.getElementById('audio-player').onended = function() {
            document.getElementById('btn-pista-1').disabled = false;
            document.getElementById('pista-status').innerText = "¡Pista 1 desbloqueada!";
            document.getElementById('pista-status').style.color = "#22c55e";
            document.getElementById('btn-evaluar').style.display = '';
        };

        function terminarAudio() {
            document.getElementById('audio-player').pause();
            document.getElementById('btn-play').innerText = "REPRODUCIR";
            document.getElementById('btn-pista-1').disabled = false;
            document.getElementById('pista-status').innerText = "¡Pista 1 desbloqueada!";
            document.getElementById('pista-status').style.color = "#22c55e";
            document.getElementById('btn-evaluar').style.display = '';
        }

        function mostrarPista(numero) {
            const texto = pistasData[currentActiveID] ? pistasData[currentActiveID][numero-1] : "Pista no disponible.";
            const titulos = ["", "Pista 1 — El Enigma", "Pista 2 — El Rastro", "Pista 3 — Los Rostros"];
            document.getElementById('pista-titulo').innerText = titulos[numero];
            document.getElementById('pista-texto').innerText  = texto;
            document.getElementById('modal-bg').style.display    = 'block';
            document.getElementById('pista-modal').style.display = 'block';
            const btn = document.getElementById(`btn-pista-${numero}`);
            btn.disabled = true; btn.innerText = "Vista";
            if(numero < 3) {
                document.getElementById(`btn-pista-${numero+1}`).disabled = false;
                document.getElementById('pista-status').innerText = `¡Pista ${numero+1} disponible!`;
            } else {
                document.getElementById('pista-status').innerText = "Todas las pistas reveladas.";
            }
        }

        function cerrarPista() {
            document.getElementById('modal-bg').style.display    = 'none';
            document.getElementById('pista-modal').style.display = 'none';
            document.getElementById('eval-modal').style.display  = 'none';
        }

        function updateHistoryUI() {
            const section = document.getElementById('history-section');
            const list    = document.getElementById('history-list');
            if(section) section.style.display = 'block';
            if(list) {
                list.innerHTML = '';
                viewedHistory.forEach(id => {
                    const div = document.createElement('div');
                    div.className = 'history-item-container';
                    if(idsConImagen.has(id)) {
                        const img = document.createElement('img');
                        img.src = `./imagenes/${baseNombres[id]}.png`;
                        img.className = 'history-item';
                        img.onerror = function() { this.style.display='none'; };
                        div.appendChild(img);
                    } else {
                        const ph = document.createElement('div');
                        ph.className = 'history-item';
                        ph.style.cssText = 'background:#1e293b;display:flex;align-items:center;justify-content:center;font-size:1.2rem;';
                        ph.innerText = '🔊';
                        div.appendChild(ph);
                    }
                    const tag = document.createElement('div');
                    tag.className = 'history-id-tag';
                    tag.innerText = id;
                    div.appendChild(tag);
                    list.appendChild(div);
                });
            }
        }

        function closePlayer() {
            document.getElementById('audio-player').pause();
            document.getElementById('player-overlay').style.display = 'none';
            document.getElementById('qr-image').style.display       = 'none';
            document.getElementById('qr-placeholder').style.display = 'block';
            document.getElementById('qr-svg').innerHTML = '';
            document.getElementById('qr-id-label').innerText = '';
            currentActiveID = null;
        }

        function toggleAudio() {
            const audio = document.getElementById('audio-player');
            if(audio.paused) { audio.play();  document.getElementById('btn-play').innerText = "PAUSAR"; }
            else             { audio.pause(); document.getElementById('btn-play').innerText = "REPRODUCIR"; }
        }

        function showGallery() {
            document.getElementById('view-generator').classList.remove('active');
            document.getElementById('view-gallery').classList.add('active');
            renderGrid();
        }

        function showGenerator() {
            document.getElementById('view-gallery').classList.remove('active');
            document.getElementById('view-generator').classList.add('active');
        }

        function renderGrid() {
            const grid = document.getElementById('selection-grid');
            grid.innerHTML = '';
            Object.keys(baseNombres).sort().forEach(id => {
                const tieneImg = idsConImagen.has(id);
                const tieneAud = idsConAudio.has(id);
                const activo   = tieneImg || tieneAud;
                const div = document.createElement('div');
                div.style.cssText = `background:#1e293b;border-radius:12px;overflow:hidden;` +
                    `cursor:${activo?'pointer':'default'};` +
                    `border:${tieneAud?'2px solid #3b82f6':'1px solid #334155'};` +
                    `opacity:${activo?'1':'0.35'};position:relative;`;
                if(activo) div.onclick = () => openMystery(id, false);

                if(tieneAud) {
                    const badge = document.createElement('span');
                    badge.style.cssText = 'position:absolute;top:4px;right:4px;background:#3b82f6;border-radius:4px;font-size:9px;padding:2px 4px;font-weight:bold;z-index:1;';
                    badge.innerText = '🔊';
                    div.appendChild(badge);
                }

                if(tieneImg) {
                    const img = document.createElement('img');
                    img.src = `./imagenes/${baseNombres[id]}.png`;
                    img.style.cssText = 'width:100%;height:110px;object-fit:cover;display:block;';
                    img.onerror = function() { thumbError(this); };
                    div.appendChild(img);
                } else {
                    const ph = document.createElement('div');
                    ph.style.cssText = 'width:100%;height:110px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;';
                    ph.innerText = '🔊';
                    div.appendChild(ph);
                }

                const label = document.createElement('div');
                label.style.cssText = 'padding:6px;text-align:center;';
                label.innerHTML = `<span style="font-size:0.7rem;color:${tieneImg?'var(--accent)':'#94a3b8'};font-weight:bold;">ID ${id}</span>`;
                div.appendChild(label);
                grid.appendChild(div);
            });
        }

        function fmtTime(s) {
            if(isNaN(s)||!isFinite(s)) return '00:00';
            return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`;
        }

        document.getElementById('audio-player').ontimeupdate = () => {
            const audio = document.getElementById('audio-player');
            const bar   = document.getElementById('progress-bar');
            const time  = document.getElementById('time-display');
            if(audio.duration) {
                if(bar)  bar.style.width = (audio.currentTime/audio.duration*100)+'%';
                if(time) time.innerText  = `${fmtTime(audio.currentTime)} / ${fmtTime(audio.duration)}`;
            }
        };

        function seekAudio(event, barEl) {
            const audio = document.getElementById('audio-player');
            if(!audio.duration) return;
            const rect = barEl.getBoundingClientRect();
            audio.currentTime = ((event.clientX-rect.left)/rect.width)*audio.duration;
        }

        updateCounter();
    </script>
</body>
</html>
